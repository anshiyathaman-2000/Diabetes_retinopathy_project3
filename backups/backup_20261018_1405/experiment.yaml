# Configuration for Diabetic Retinopathy Detection using IDRiD
project_name: "idrid_dr_detection"
experiment_name: "baseline_vs_hybrid"
seed: 42

# Data Paths
data:
  base_dir: "B. Disease Grading"
  train_images_dir: "B. Disease Grading/1. Original Images/a. Training Set"
  train_csv: "B. Disease Grading/2. Groundtruths/a. IDRiD_Disease Grading_Training Labels.csv"
  test_images_dir: "B. Disease Grading/1. Original Images/b. Testing Set"
  test_csv: "B. Disease Grading/2. Groundtruths/b. IDRiD_Disease Grading_Testing Labels.csv"
  val_split_ratio: 0.20 # 80% train (330 images), 20% val (83 images) from official train set
  cache_dir: "data/cache"
  num_workers: 0

# Task Configuration
task:
  # Options: 'five_class' (Grades 0-4) or 'binary' (0: Non-referable [0,1], 1: Referable [2,3,4])
  type: "five_class"
  num_classes: 5
  binary_threshold: 2 # Grade >= 2 is referable DR

# Preprocessing & Augmentation
preprocessing:
  image_size: 256 # Configurable (e.g. 256, 384, 512)
  # Options: 'clahe' (Green-channel / LAB CLAHE), 'original', 'crop_circle'
  method: "clahe"
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  augmentation:
    horizontal_flip_prob: 0.5
    vertical_flip_prob: 0.5
    rotation_degrees: 15
    brightness_jitter: 0.1
    contrast_jitter: 0.1

# Model Architecture
model:
  # Options: 'resnet50' (Baseline), 'cnn_transformer_bilstm' (Proposed Hybrid)
  name: "resnet50"
  pretrained: true
  dropout: 0.3
  # Proposed hybrid model hyperparameters:
  hybrid:
    backbone: "resnet50"
    cnn_embed_dim: 256
    transformer_layers: 2
    transformer_heads: 8
    transformer_feedforward: 512
    transformer_dropout: 0.2
    bilstm_hidden_dim: 128
    bilstm_layers: 1
    bilstm_dropout: 0.1

# Training Hyperparameters
training:
  batch_size: 16
  epochs: 25
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: "adamw" # 'adamw' or 'adam'
  lr_scheduler: "cosine" # 'cosine' or 'plateau'
  use_class_weights: true # Handle 4.8% Grade 1 class imbalance
  early_stopping:
    enabled: true
    patience: 7
    monitor_metric: "val_qwk" # 'val_qwk', 'val_macro_f1', or 'val_loss'
    mode: "max"

# Hardware
hardware:
  device: "auto" # 'auto' checks MPS -> CUDA -> CPU

# Output directories
paths:
  checkpoints_dir: "checkpoints"
  metrics_dir: "outputs/metrics"
  plots_dir: "outputs/plots"
  predictions_dir: "outputs/predictions"
  explainability_dir: "outputs/explainability"
