# ==============================================================================
# Configuration: Exp B2 — Hybrid CNN-Transformer-BiLSTM at 512x512
# Project: IDRiD Diabetic Retinopathy 5-Class Grading (Fair Benchmark with Exp B1)
# ==============================================================================
project_name: "idrid_dr_detection"
experiment_name: "exp_b2_hybrid_res512"
seed: 42
exp_suffix: "exp_b2_res512"

# 1. Data Paths & Verified Corrective Split Manifest
data:
  base_dir: "B. Disease Grading"
  train_images_dir: "B. Disease Grading/1. Original Images/a. Training Set"
  train_csv: "B. Disease Grading/2. Groundtruths/a. IDRiD_Disease Grading_Training Labels.csv"
  test_images_dir: "B. Disease Grading/1. Original Images/b. Testing Set"
  test_csv: "B. Disease Grading/2. Groundtruths/b. IDRiD_Disease Grading_Testing Labels.csv"
  val_split_ratio: 0.20
  split_type: "leakage_aware"
  split_manifest: "data/splits/exp_b1_corrective_no_train_test_duplicate_manifest.json"
  cache_dir: "data/cache"
  num_workers: 0

# 2. Task Configuration (5-Class Ordinal Grading)
task:
  type: "five_class"
  num_classes: 5
  binary_threshold: 2

# 3. Preprocessing & Augmentation (Identical to Exp B1 ResNet-50)
preprocessing:
  image_size: 512
  method: "clahe"
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  augmentation:
    horizontal_flip_prob: 0.5
    vertical_flip_prob: 0.5
    rotation_degrees: 15
    brightness_jitter: 0.1
    contrast_jitter: 0.1

# 4. Proposed Hybrid Model Architecture
model:
  name: "hybrid"
  pretrained: true
  dropout: 0.3
  hybrid:
    backbone: "resnet50"
    cnn_embed_dim: 256
    transformer_layers: 2
    transformer_heads: 8
    transformer_feedforward: 512
    transformer_dropout: 0.2
    bilstm_hidden_dim: 128
    bilstm_layers: 1
    bilstm_dropout: 0.1
    pool_type: "mean_max"

# 5. Training Hyperparameters (Identical Effective Optimization to Exp B1)
training:
  batch_size: 8            # Micro-batch size
  grad_accum_steps: 2      # Gradient accumulation steps: 8 * 2 = 16 effective batch size
  epochs: 15
  learning_rate: 0.0001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  optimizer: "adamw"
  lr_scheduler: "cosine"
  use_class_weights: true
  class_weight_method: "sqrt"
  early_stopping:
    enabled: true
    patience: 7
    monitor_metric: "val_qwk"
    mode: "max"

hardware:
  device: "auto"

paths:
  checkpoints_dir: "checkpoints"
  metrics_dir: "outputs/metrics"
  plots_dir: "outputs/plots"
  predictions_dir: "outputs/predictions"
  explainability_dir: "outputs/explainability"
